<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Haija — AI game engine</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #171a2b;
    --panel-2: #1e2236;
    --border: #2a2f47;
    --text: #dbe0ee;
    --muted: #8a90a8;
    --accent: #7c5cff;
    --accent-2: #4f8cff;
    --ok: #3ddc84;
    --warn: #ffb454;
    --err: #ff5c7a;
    --mono: "SFMono-Regular", "Cascadia Code", "Consolas", "Menlo", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .spacer { flex: 1; }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 13px;
    font-size: 13px;
    cursor: pointer;
    transition: background .12s ease, transform .05s ease;
  }
  button:hover { background: #262b44; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #6a49ff; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  main { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 290px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 14px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 3px; }
  .proj-name { font-size: 15px; font-weight: 600; }
  .proj-dir { font-size: 12px; color: var(--muted); word-break: break-all; }
  #agents { list-style: none; margin: 0; padding: 0; }
  #agents li {
    font-size: 13px;
    padding: 5px 8px;
    background: var(--panel-2);
    border-radius: 6px;
    margin-bottom: 4px;
    border-left: 3px solid var(--accent-2);
  }
  .actions { display: flex; flex-wrap: wrap; gap: 7px; }
  .actions button { flex: 1 1 40%; }

  section.log {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  section.log .bar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .status { font-size: 13px; color: var(--muted); flex: 1; }
  .status.busy { color: var(--warn); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    background: #0b0d17;
  }
  #log .dim { color: var(--muted); }
  #log .agent { color: var(--accent-2); }
  #log .tool { color: var(--warn); }
  #log .chat { color: var(--ok); }
  #log .outcome { color: var(--err); font-weight: 600; }

  /* Options overlay */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
  }
  .overlay.hidden { display: none; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: min(680px, 92vw);
    max-height: 86vh;
    overflow-y: auto;
    display: flex; flex-direction: column;
    padding: 18px;
  }
  .modal h2 { margin: 0 0 12px; font-size: 16px; }
  .modal .row { margin-bottom: 10px; }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .modal input[type="text"] {
    width: 100%; padding: 8px; border-radius: 7px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  }
  .arch-list {
    max-height: 240px; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 7px; padding: 6px;
  }
  .arch-list label {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 5px; font-size: 13px; color: var(--text); cursor: pointer;
  }
  .arch-list label:hover { background: var(--panel-2); border-radius: 5px; }
  .arch-list .pers { color: var(--muted); font-size: 12px; }
  .modal .footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .tabs { display: flex; gap: 1px; margin-bottom: 14px; background: var(--border); border-radius: 7px; overflow: hidden; }
  .tab-btn { background: var(--bg); border: none; color: var(--muted); border-radius: 0; padding: 6px 18px; font-size: 12px; cursor: pointer; transition: background .15s; }
  .tab-btn.active { background: var(--panel-2); color: var(--text); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .gen-stream { background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px; padding: 10px 14px; max-height: 200px; overflow-y: auto; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; margin-bottom: 6px; }

  /* Per-agent thinking */
  .agent-think-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: 13px; }
  .agent-think-row span { flex: 1; }
  .agent-think-row select {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px;
  }

  /* Replay overlay */
  .replay-modal { width: min(940px, 96vw); height: 90vh; overflow: hidden; }
  .replay-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .replay-head h2 { margin: 0 0 4px; }
  .replay-meta { font-size: 13px; color: var(--muted); }
  .replay-controls { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .replay-controls input[type="range"] { flex: 1; }
  .rp-label { font-family: var(--mono); font-size: 13px; min-width: 90px; text-align: center; }
  .replay-body { flex: 1; overflow-y: auto; margin-top: 10px; font-family: var(--mono); font-size: 12.5px; }
  .rp-entry { margin-bottom: 10px; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .rp-entry .rp-head { padding: 6px 10px; font-weight: 600; background: var(--panel-2); }
  .rp-entry pre { margin: 0; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; background: #0b0d17; font: inherit; }
  .rp-entry details summary { padding: 6px 10px; cursor: pointer; color: var(--accent-2); background: var(--panel-2); }
  .rp-entry details pre { border-top: 1px solid var(--border); }
  .rp-state .rp-head { color: var(--muted); }
  .rp-agent .rp-head { color: var(--accent-2); }
  .rp-tool .rp-head { color: var(--warn); }
  .rp-chat .rp-head { color: var(--ok); }
  .rp-outcome .rp-head { color: var(--err); }
</style>
</head>
<body>
<header>
  <h1>Haija<span>·</span> game engine</h1>
  <div class="spacer"></div>
  <button id="btn-open">Open…</button>
  <button id="btn-new">New…</button>
  <button id="btn-options">Options…</button>
</header>

<main>
  <aside>
    <div>
      <div class="field-label">Project</div>
      <div class="proj-name" id="proj-name">(none)</div>
      <div class="proj-dir" id="proj-dir"></div>
    </div>
    <div>
      <div class="field-label">Tone</div>
      <div id="tone" style="font-size:13px">(none)</div>
    </div>
    <div>
      <div class="field-label">Model</div>
      <div id="model" style="font-size:13px">(none)</div>
    </div>
    <div>
      <div class="field-label">Agents</div>
      <ul id="agents"></ul>
    </div>
    <div class="actions">
      <button id="btn-generate" class="primary">Generate</button>
      <button id="btn-validate">Validate</button>
      <button id="btn-run" class="primary">Run</button>
      <button id="btn-stop" class="primary" style="display:none;background:var(--err);border-color:var(--err)">Stop</button>
      <button id="btn-export">Export</button>
      <button id="btn-replay">Replay</button>
    </div>
  </aside>

  <section class="log">
    <div class="bar">
      <div class="status" id="status">Ready — open a project to begin.</div>
      <button id="btn-clear" title="Clear log">Clear</button>
    </div>
    <div id="log"></div>
  </section>
</main>

<!-- Options overlay -->
<div class="overlay hidden" id="opts-overlay">
  <div class="modal">
    <h2>Game options</h2>
    <div class="tabs">
      <button class="tab-btn active" data-tab="game">Game</button>
      <button class="tab-btn" data-tab="model">Model</button>
      <button class="tab-btn" data-tab="general">General</button>
    </div>
    <div class="tab-panel active" id="tab-game">
      <div class="row">
        <label>Game tone (applied to all agents)</label>
        <input type="text" id="opt-tone" placeholder="e.g. whimsical and cutthroat" />
      </div>
      <div class="row">
        <label>Thinking depth per agent (off / low / medium / high)</label>
        <div id="opt-agents"></div>
      </div>
      <div class="row">
        <label>Archetypes (check = add as an agent)</label>
        <div class="arch-list" id="opt-archs"></div>
      </div>
    </div>
    <div class="tab-panel" id="tab-model">
      <div class="row">
        <label>Model (default provider is OpenRouter)</label>
        <input type="text" id="opt-model" placeholder="model id" />
      </div>
      <div class="row">
        <label>Base URL</label>
        <input type="text" id="opt-base-url" placeholder="https://openrouter.ai/api/v1" />
      </div>
      <div class="row">
        <label>API key env var</label>
        <input type="text" id="opt-api-key-env" placeholder="OPENROUTER_API_KEY" />
      </div>
    </div>
    <div class="tab-panel" id="tab-general">
      <div class="row">
        <label>Log level</label>
        <select id="opt-log-level">
          <option value="debug">debug</option>
          <option value="info" selected>info</option>
          <option value="warning">warning</option>
          <option value="error">error</option>
        </select>
      </div>
      <div class="row">
        <label>Log file (leave empty for default ~/.haija/haija.log)</label>
        <input type="text" id="opt-log-file" placeholder="e.g. /path/to/haija.log" />
      </div>
    </div>
    <div class="footer">
      <button id="opt-cancel">Cancel</button>
      <button id="opt-save" class="primary">Save options</button>
    </div>
  </div>
</div>

<!-- Replay overlay -->
<div class="overlay hidden" id="replay-overlay">
  <div class="modal replay-modal">
    <div class="replay-head">
      <div>
        <h2 id="replay-title">Replay</h2>
        <div class="replay-meta" id="replay-meta"></div>
      </div>
      <button id="replay-close">✕</button>
    </div>
    <div class="replay-controls">
      <button id="rp-prev">◀</button>
      <button id="rp-play" class="primary">▶ Play</button>
      <button id="rp-next">▶</button>
      <input type="range" id="rp-slider" min="0" max="0" value="0" />
      <span class="rp-label" id="rp-label">Setup</span>
    </div>
    <div class="replay-body" id="rp-body"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const logEl = $('log');
let eventsSince = 0;
let polling = false;

async function api(path, method = 'GET', body = null) {
  const opts = { method };
  if (body) { opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  return r.json();
}

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function logLine(text, cls) {
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog() { logEl.innerHTML = ''; }
function setStatus(text, busy) {
  const s = $('status');
  s.textContent = text;
  s.className = busy ? 'status busy' : 'status';
}

function formatEvent(ev) {
  const t = ev.type;
  if (t === 'game_start') {
    let out = `=== ${ev.name} ===\n`;
    if (ev.description) out += ev.description + '\n';
    out += `Objective: ${ev.objective || '(none)'} · Agents: ${(ev.agents || []).join(', ')}\n`;
    out += `Order: ${ev.order} · max_turns: ${ev.max_turns}`;
    return out;
  }
  if (t === 'turn_start') return `\n--- Turn ${ev.turn} — ${ev.agent} ---`;
  if (t === 'assistant') return `[${ev.agent} says] ${ev.content}`;
  if (t === 'reasoning') return `[${ev.agent} thinks] ${ev.reasoning}`;
  if (t === 'tool') return `[${ev.agent} → ${ev.name}(${JSON.stringify(ev.arguments || {})})]`;
  if (t === 'message') return `[${ev.from} → ${ev.to}] ${ev.text}`;
  if (t === 'log') return `[${ev.from} logs] ${ev.text}`;
  if (t === 'remember') return `[${ev.agent} remembers] ${ev.key}`;
  if (t === 'alliance') return `[alliance] ${ev.from} ${ev.action === 'form' ? 'forms alliance with' : 'breaks alliance with'} ${ev.with}`;
  if (t === 'outcome') return `[${ev.from} declares] ${ev.outcome} (winner ${ev.winner || '?'}): ${ev.reason || ''}`;
  if (t === 'game_over') {
    let out = '\n=== GAME OVER ===';
    if (ev.outcome) out += `\nOutcome: ${ev.outcome} (winner ${ev.winner || '?'})`;
    else out += '\nTurn limit reached — no outcome declared.';
    out += '\nFinal state:\n' + JSON.stringify(ev.final_state || {}, null, 2);
    return out;
  }
  if (t === 'info') return ev.message;
  if (t === 'error') return `[error] ${ev.message}`;
  if (t === 'generate_start') return `[generate] Generating framework…`;
  if (t === 'generate_stream') return '';
  if (t === 'generate_done') return `[generate] Framework ready — ${(ev.framework && ev.framework.actions && ev.framework.actions.length) || 0} action(s).`;
  if (t === 'done') return '';
  return JSON.stringify(ev);
}
function eventClass(ev) {
  if (ev.type === 'message') return 'chat';
  if (ev.type === 'tool') return 'tool';
  if (ev.type === 'outcome' || ev.type === 'game_over') return 'outcome';
  if (ev.type === 'assistant' || ev.type === 'reasoning') return 'agent';
  if (ev.type === 'remember') return 'agent';
  if (ev.type === 'alliance') return 'chat';
  return '';
}

async function loadStatus() {
  const s = await api('/api/status');
  if (s.project) {
    $('proj-name').textContent = s.project;
    $('proj-dir').textContent = s.dir || '';
    $('tone').textContent = s.tone || '(none)';
    $('model').textContent = `${s.model_provider || 'openrouter'} / ${s.model_model || ''}`;
    const list = $('agents');
    list.innerHTML = '';
    (s.agents || []).forEach(a => {
      const li = document.createElement('li');
      li.textContent = `${a.name} (${a.archetype || 'custom'})`;
      list.appendChild(li);
    });
  }
  return s;
}

function startPolling() {
  polling = true;
  $('btn-run').style.display = 'none';
  $('btn-stop').style.display = '';
  poll();
}
function poll() {
  if (!polling) return;
  api(`/api/events?since=${eventsSince}`).then(data => {
    (data.events || []).forEach(ev => {
      const text = formatEvent(ev);
      if (text) logLine(text, eventClass(ev));
      // Live streaming preview for framework generation
      if (ev.type === 'generate_stream' && ev.full) {
        let gs = $('gen-stream');
        if (!gs) { gs = document.createElement('div'); gs.id = 'gen-stream'; gs.className = 'gen-stream'; $('log').appendChild(gs); }
        gs.textContent = ev.full;
        gs.scrollTop = gs.scrollHeight;
      }
      if (ev.type === 'generate_done' || ev.type === 'done') {
        const gs = $('gen-stream');
        if (gs) gs.remove();
      }
      if (ev.type === 'done') { stopPolling(); setStatus('Done'); }
      if (ev.type === 'error') stopPolling();
    });
    eventsSince = data.next;
    if (polling) setTimeout(poll, 300);
  });
}
function stopPolling() {
  polling = false;
  $('btn-stop').style.display = 'none';
  $('btn-run').style.display = '';
}

async function doOpen() {
  const path = prompt('Project directory:', '.');
  if (path == null) return;
  const r = await api('/api/open', 'POST', { path });
  logLine(r.ok ? r.message : `[error] ${r.message}`, r.ok ? '' : 'outcome');
  if (r.ok) { clearLog(); await loadStatus(); setStatus(`Loaded ${r.project}`); }
}
async function doNew() {
  const name = prompt('New project name:');
  if (!name) return;
  const dir = prompt('Directory (blank = ~/.haija/projects):', '') || '';
  const r = await api('/api/new', 'POST', { name, dir });
  logLine(r.ok ? r.message : `[error] ${r.message}`, r.ok ? '' : 'outcome');
  if (r.ok) { clearLog(); await loadStatus(); setStatus(`Created ${name}`); }
}
async function doGenerate() {
  const p = prompt('Describe your game:');
  if (p == null || !p.trim()) return;
  clearLog();
  logLine(`[generate] prompt: ${p}`, 'dim');
  setStatus('Generating framework…', true);
  const r = await api('/api/generate', 'POST', { prompt: p });
  if (!r.ok) { logLine(`[error] ${r.message}`, 'outcome'); setStatus('Error'); return; }
  eventsSince = 0;
  startPolling();
}
async function doValidate() {
  const r = await api('/api/validate', 'POST');
  logLine(r.ok ? `[validate] ${r.message}` : `[error] ${r.message}`, r.ok ? '' : 'outcome');
}
async function doRun() {
  clearLog();
  const r = await api('/api/run', 'POST');
  if (!r.ok) { logLine(`[error] ${r.message}`, 'outcome'); return; }
  eventsSince = 0;
  setStatus('Running…', true);
  startPolling();
}
async function doStop() {
  const r = await api('/api/stop', 'POST');
  if (r.ok) logLine('[stop] stopping…', 'dim');
}
async function doExport() {
  const r = await api('/api/export', 'POST');
  logLine(r.ok ? r.message : `[error] ${r.message}`, r.ok ? '' : 'outcome');
}

async function openOptions() {
  const s = await loadStatus();
  $('opt-tone').value = s.tone || '';
  $('opt-model').value = s.model_model || '';
  $('opt-base-url').value = s.model_base_url || '';
  $('opt-api-key-env').value = s.model_api_key_env || '';
  $('opt-log-level').value = s.log_level || 'info';
  $('opt-log-file').value = s.log_file || '';
  const list = $('opt-archs');
  list.innerHTML = '';
  (s.archetypes || []).forEach(a => {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!a.enabled;
    cb.dataset.id = a.id;
    label.appendChild(cb);
    const span = document.createElement('span');
    span.innerHTML = `<strong>${esc(a.name)}</strong>${a.custom ? ' <em style="color:#8a90a8">(custom)</em>' : ''}<br/><span class="pers">${esc(a.persona)}</span>`;
    label.appendChild(span);
    list.appendChild(label);
  });
  const agentsEl = $('opt-agents');
  agentsEl.innerHTML = '';
  (s.agents || []).forEach(a => {
    const row = document.createElement('div');
    row.className = 'agent-think-row';
    const name = document.createElement('span');
    name.textContent = a.name;
    const sel = document.createElement('select');
    sel.dataset.agent = a.name;
    [['', 'default'], ['off', 'off'], ['low', 'low (fast)'], ['medium', 'medium'], ['high', 'high (deep)']].forEach(([val, label]) => {
      const opt = document.createElement('option');
      opt.value = val; opt.textContent = label;
      if ((a.thinking || '') === val) opt.selected = true;
      sel.appendChild(opt);
    });
    row.appendChild(name); row.appendChild(sel);
    agentsEl.appendChild(row);
  });
  $('opts-overlay').classList.remove('hidden');
}
function closeOptions() { $('opts-overlay').classList.add('hidden'); }
async function saveOptions() {
  const enabled = Array.from(document.querySelectorAll('#opt-archs input:checked')).map(cb => cb.dataset.id);
  const agentThinking = {};
  document.querySelectorAll('#opt-agents select').forEach(sel => { agentThinking[sel.dataset.agent] = sel.value; });
  const r = await api('/api/options', 'POST', {
    tone: $('opt-tone').value,
    model: $('opt-model').value,
    base_url: $('opt-base-url').value,
    api_key_env: $('opt-api-key-env').value,
    enabled_archetypes: enabled,
    agent_thinking: agentThinking,
    log_level: $('opt-log-level').value,
    log_file: $('opt-log-file').value,
  });
  closeOptions();
  logLine(r.message, r.ok ? '' : 'outcome');
  await loadStatus();
}

// ---- replay ----
let replayData = null;
let replayTurns = [];
let replayIndex = 0;
let replayTimer = null;

function rpHeader(text) {
  const d = document.createElement('div');
  d.className = 'rp-head';
  d.textContent = text;
  return d;
}
function rpPre(text) {
  const p = document.createElement('pre');
  p.textContent = text;
  return p;
}
function rpCollapsible(title, content, open) {
  const det = document.createElement('details');
  if (open) det.open = true;
  const sum = document.createElement('summary');
  sum.textContent = title;
  det.appendChild(sum);
  det.appendChild(rpPre(content));
  return det;
}
function renderReplayEntry(e) {
  const div = document.createElement('div');
  div.className = 'rp-entry';
  const t = e.type;
  if (t === 'state') {
    div.classList.add('rp-state');
    div.appendChild(rpCollapsible(`state · ${e.label || ''}`, JSON.stringify(e.state, null, 2)));
  } else if (t === 'assistant') {
    div.classList.add('rp-agent');
    div.appendChild(rpHeader(`${e.agent} → response`));
    div.appendChild(rpPre(e.content || '(no text)'));
    if (e.reasoning) div.appendChild(rpCollapsible(`${e.agent} → thinking`, e.reasoning));
  } else if (t === 'tool_call') {
    div.classList.add('rp-tool');
    div.appendChild(rpHeader(`${e.agent} → ${e.name}(${JSON.stringify(e.arguments || {})})`));
  } else if (t === 'tool_result') {
    div.classList.add('rp-tool');
    div.appendChild(rpCollapsible(`↳ ${e.name} result`, String(e.result ?? ''), true));
  } else if (t === 'message') {
    div.classList.add('rp-chat');
    div.appendChild(rpHeader(`💬 ${e.from} → ${e.to}: ${e.text}`));
  } else if (t === 'log') {
    div.classList.add('rp-chat');
    div.appendChild(rpHeader(`📝 ${e.from}: ${e.text}`));
  } else if (t === 'remember') {
    div.classList.add('rp-chat');
    div.appendChild(rpHeader(`🔒 ${e.agent} remembers '${e.key}'`));
  } else if (t === 'alliance') {
    div.classList.add('rp-chat');
    div.appendChild(rpHeader(`🤝 ${e.from} ${e.action === 'form' ? 'forms alliance with' : 'breaks alliance with'} ${e.with}`));
  } else if (t === 'outcome') {
    div.classList.add('rp-outcome');
    div.appendChild(rpHeader(`${e.from} declares ${e.outcome} (winner ${e.winner || '?'})`));
    if (e.reason) div.appendChild(rpPre(e.reason));
  } else {
    div.appendChild(rpPre(JSON.stringify(e, null, 2)));
  }
  return div;
}
function replayEntriesFor(turn) {
  return (replayData.run_log || []).filter(e => (e.turn ?? 0) === turn);
}
function renderReplayTurn() {
  const turn = replayTurns[replayIndex];
  $('rp-slider').value = replayIndex;
  $('rp-label').textContent = turn === 0 ? 'Setup' : `Turn ${turn}`;
  $('rp-prev').disabled = replayIndex <= 0;
  $('rp-next').disabled = replayIndex >= replayTurns.length - 1;
  const body = $('rp-body');
  body.innerHTML = '';
  replayEntriesFor(turn).forEach(e => body.appendChild(renderReplayEntry(e)));
  if (replayIndex === replayTurns.length - 1 && replayData.final_state) {
    const div = document.createElement('div');
    div.className = 'rp-entry rp-outcome';
    div.appendChild(rpHeader('FINAL STATE'));
    div.appendChild(rpPre(JSON.stringify(replayData.final_state, null, 2)));
    body.appendChild(div);
  }
  body.scrollTop = 0;
}
function stopReplayTimer() {
  if (replayTimer) { clearInterval(replayTimer); replayTimer = null; }
  $('rp-play').textContent = '▶ Play';
}
function toggleReplayPlay() {
  if (replayTimer) { stopReplayTimer(); return; }
  $('rp-play').textContent = '⏸ Pause';
  replayTimer = setInterval(() => {
    if (replayIndex >= replayTurns.length - 1) { stopReplayTimer(); return; }
    replayIndex++;
    renderReplayTurn();
  }, 1500);
}
async function doReplay() {
  stopReplayTimer();
  const r = await api('/api/replay');
  if (!r.ok) { logLine(`[replay] ${r.message}`, 'outcome'); return; }
  replayData = r;
  replayTurns = Array.from(new Set((r.run_log || []).map(e => e.turn ?? 0))).sort((a, b) => a - b);
  replayIndex = 0;
  $('replay-title').textContent = r.name;
  $('replay-meta').textContent = `${(r.agents || []).join(', ')}${r.objective ? ' — ' + r.objective : ''}`;
  $('rp-slider').max = Math.max(0, replayTurns.length - 1);
  $('replay-overlay').classList.remove('hidden');
  renderReplayTurn();
}
function closeReplay() {
  stopReplayTimer();
  $('replay-overlay').classList.add('hidden');
}

$('btn-open').onclick = doOpen;
$('btn-new').onclick = doNew;
$('btn-generate').onclick = doGenerate;
$('btn-validate').onclick = doValidate;
$('btn-run').onclick = doRun;
$('btn-stop').onclick = doStop;
$('btn-export').onclick = doExport;
$('btn-options').onclick = openOptions;
$('btn-clear').onclick = clearLog;
$('opt-cancel').onclick = closeOptions;
$('opt-save').onclick = saveOptions;
$('opts-overlay').addEventListener('click', (e) => { if (e.target === $('opts-overlay')) closeOptions(); });
// Options tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    const tab = document.getElementById('tab-' + btn.dataset.tab);
    if (tab) tab.classList.add('active');
  });
});
$('btn-replay').onclick = doReplay;
$('replay-close').onclick = closeReplay;
$('rp-prev').onclick = () => { if (replayIndex > 0) { replayIndex--; renderReplayTurn(); } };
$('rp-next').onclick = () => { if (replayIndex < replayTurns.length - 1) { replayIndex++; renderReplayTurn(); } };
$('rp-play').onclick = toggleReplayPlay;
$('rp-slider').addEventListener('input', () => { replayIndex = +$('rp-slider').value; renderReplayTurn(); });
$('replay-overlay').addEventListener('click', (e) => { if (e.target === $('replay-overlay')) closeReplay(); });

loadStatus();
</script>

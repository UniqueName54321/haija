<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Haija — AI game engine</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #171a2b;
    --panel-2: #1e2236;
    --border: #2a2f47;
    --text: #dbe0ee;
    --muted: #8a90a8;
    --accent: #7c5cff;
    --accent-2: #4f8cff;
    --ok: #3ddc84;
    --warn: #ffb454;
    --err: #ff5c7a;
    --mono: "SFMono-Regular", "Cascadia Code", "Consolas", "Menlo", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .spacer { flex: 1; }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 13px;
    font-size: 13px;
    cursor: pointer;
    transition: background .12s ease, transform .05s ease;
  }
  button:hover { background: #262b44; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #6a49ff; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  main { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 290px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 14px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 3px; }
  .proj-name { font-size: 15px; font-weight: 600; }
  .proj-dir { font-size: 12px; color: var(--muted); word-break: break-all; }
  #agents { list-style: none; margin: 0; padding: 0; }
  #agents li {
    font-size: 13px;
    padding: 5px 8px;
    background: var(--panel-2);
    border-radius: 6px;
    margin-bottom: 4px;
    border-left: 3px solid var(--accent-2);
  }
  .actions { display: flex; flex-wrap: wrap; gap: 7px; }
  .actions button { flex: 1 1 40%; }

  section.log {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  section.log .bar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .status { font-size: 13px; color: var(--muted); flex: 1; }
  .status.busy { color: var(--warn); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    background: #0b0d17;
  }
  #log .dim { color: var(--muted); }
  #log .agent { color: var(--accent-2); }
  #log .tool { color: var(--warn); }
  #log .chat { color: var(--ok); }
  #log .outcome { color: var(--err); font-weight: 600; }

  /* Options overlay */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
  }
  .overlay.hidden { display: none; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: min(680px, 92vw);
    max-height: 86vh;
    display: flex; flex-direction: column;
    padding: 18px;
  }
  .modal h2 { margin: 0 0 12px; font-size: 16px; }
  .modal .row { margin-bottom: 10px; }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .modal input[type="text"] {
    width: 100%; padding: 8px; border-radius: 7px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  }
  .arch-list {
    max-height: 240px; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 7px; padding: 6px;
  }
  .arch-list label {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 5px; font-size: 13px; color: var(--text); cursor: pointer;
  }
  .arch-list label:hover { background: var(--panel-2); border-radius: 5px; }
  .arch-list .pers { color: var(--muted); font-size: 12px; }
  .modal .footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>
<header>
  <h1>Haija<span>·</span> game engine</h1>
  <div class="spacer"></div>
  <button id="btn-open">Open…</button>
  <button id="btn-new">New…</button>
  <button id="btn-options">Options…</button>
</header>

<main>
  <aside>
    <div>
      <div class="field-label">Project</div>
      <div class="proj-name" id="proj-name">(none)</div>
      <div class="proj-dir" id="proj-dir"></div>
    </div>
    <div>
      <div class="field-label">Tone</div>
      <div id="tone" style="font-size:13px">(none)</div>
    </div>
    <div>
      <div class="field-label">Model</div>
      <div id="model" style="font-size:13px">(none)</div>
    </div>
    <div>
      <div class="field-label">Agents</div>
      <ul id="agents"></ul>
    </div>
    <div class="actions">
      <button id="btn-generate" class="primary">Generate</button>
      <button id="btn-validate">Validate</button>
      <button id="btn-run" class="primary">Run</button>
      <button id="btn-export">Export</button>
    </div>
  </aside>

  <section class="log">
    <div class="bar">
      <div class="status" id="status">Ready — open a project to begin.</div>
      <button id="btn-clear" title="Clear log">Clear</button>
    </div>
    <div id="log"></div>
  </section>
</main>

<!-- Options overlay -->
<div class="overlay hidden" id="opts-overlay">
  <div class="modal">
    <h2>Game options</h2>
    <div class="row">
      <label>Game tone (applied to all agents)</label>
      <input type="text" id="opt-tone" placeholder="e.g. whimsical and cutthroat" />
    </div>
    <div class="row">
      <label>Archetypes (check = add as an agent)</label>
      <div class="arch-list" id="opt-archs"></div>
    </div>
    <div class="row">
      <label>Model (default provider is OpenRouter)</label>
      <input type="text" id="opt-model" placeholder="model id" />
    </div>
    <div class="row">
      <label>Base URL</label>
      <input type="text" id="opt-base-url" placeholder="https://openrouter.ai/api/v1" />
    </div>
    <div class="row">
      <label>API key env var</label>
      <input type="text" id="opt-api-key-env" placeholder="OPENROUTER_API_KEY" />
    </div>
    <div class="footer">
      <button id="opt-cancel">Cancel</button>
      <button id="opt-save" class="primary">Save options</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const logEl = $('log');
let eventsSince = 0;
let polling = false;

async function api(path, method = 'GET', body = null) {
  const opts = { method };
  if (body) { opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  return r.json();
}

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function logLine(text, cls) {
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog() { logEl.innerHTML = ''; }
function setStatus(text, busy) {
  const s = $('status');
  s.textContent = text;
  s.className = busy ? 'status busy' : 'status';
}

function formatEvent(ev) {
  const t = ev.type;
  if (t === 'game_start') {
    let out = `=== ${ev.name} ===\n`;
    if (ev.description) out += ev.description + '\n';
    out += `Objective: ${ev.objective || '(none)'} · Agents: ${(ev.agents || []).join(', ')}\n`;
    out += `Order: ${ev.order} · max_turns: ${ev.max_turns}`;
    return out;
  }
  if (t === 'turn_start') return `\n--- Turn ${ev.turn} — ${ev.agent} ---`;
  if (t === 'assistant') return `[${ev.agent} says] ${ev.content}`;
  if (t === 'reasoning') return `[${ev.agent} thinks] ${ev.reasoning}`;
  if (t === 'tool') return `[${ev.agent} → ${ev.name}(${JSON.stringify(ev.arguments || {})})]`;
  if (t === 'message') return `[${ev.from} → ${ev.to}] ${ev.text}`;
  if (t === 'log') return `[${ev.from} logs] ${ev.text}`;
  if (t === 'outcome') return `[${ev.from} declares] ${ev.outcome} (winner ${ev.winner || '?'}): ${ev.reason || ''}`;
  if (t === 'game_over') {
    let out = '\n=== GAME OVER ===';
    if (ev.outcome) out += `\nOutcome: ${ev.outcome} (winner ${ev.winner || '?'})`;
    else out += '\nTurn limit reached — no outcome declared.';
    out += '\nFinal state:\n' + JSON.stringify(ev.final_state || {}, null, 2);
    return out;
  }
  if (t === 'info') return ev.message;
  if (t === 'error') return `[error] ${ev.message}`;
  if (t === 'done') return '';
  return JSON.stringify(ev);
}
function eventClass(ev) {
  if (ev.type === 'message') return 'chat';
  if (ev.type === 'tool') return 'tool';
  if (ev.type === 'outcome' || ev.type === 'game_over') return 'outcome';
  if (ev.type === 'assistant' || ev.type === 'reasoning') return 'agent';
  return '';
}

async function loadStatus() {
  const s = await api('/api/status');
  if (s.project) {
    $('proj-name').textContent = s.project;
    $('proj-dir').textContent = s.dir || '';
    $('tone').textContent = s.tone || '(none)';
    $('model').textContent = `${s.model_provider || 'openrouter'} / ${s.model_model || ''}`;
    const list = $('agents');
    list.innerHTML = '';
    (s.agents || []).forEach(a => {
      const li = document.createElement('li');
      li.textContent = `${a.name} (${a.archetype || 'custom'})`;
      list.appendChild(li);
    });
  }
  return s;
}

function startPolling() {
  polling = true;
  poll();
}
function poll() {
  if (!polling) return;
  api(`/api/events?since=${eventsSince}`).then(data => {
    (data.events || []).forEach(ev => {
      const text = formatEvent(ev);
      if (text) logLine(text, eventClass(ev));
      if (ev.type === 'done') { stopPolling(); setStatus('Done'); }
      if (ev.type === 'error') stopPolling();
    });
    eventsSince = data.next;
    if (polling) setTimeout(poll, 300);
  });
}
function stopPolling() { polling = false; }

async function doOpen() {
  const path = prompt('Project directory:', '.');
  if (path == null) return;
  const r = await api('/api/open', 'POST', { path });
  logLine(r.ok ? r.message : `[error] ${r.message}`, r.ok ? '' : 'outcome');
  if (r.ok) { clearLog(); await loadStatus(); setStatus(`Loaded ${r.project}`); }
}
async function doNew() {
  const name = prompt('New project name:');
  if (!name) return;
  const dir = prompt('Directory:', '.') || '.';
  const r = await api('/api/new', 'POST', { name, dir });
  logLine(r.ok ? r.message : `[error] ${r.message}`, r.ok ? '' : 'outcome');
  if (r.ok) { clearLog(); await loadStatus(); setStatus(`Created ${name}`); }
}
async function doGenerate() {
  const p = prompt('Describe your game:');
  if (p == null || !p.trim()) return;
  clearLog();
  logLine(`[generate] prompt: ${p}`, 'dim');
  setStatus('Generating framework…', true);
  const r = await api('/api/generate', 'POST', { prompt: p });
  if (!r.ok) { logLine(`[error] ${r.message}`, 'outcome'); setStatus('Error'); return; }
  eventsSince = 0;
  startPolling();
}
async function doValidate() {
  const r = await api('/api/validate', 'POST');
  logLine(r.ok ? `[validate] ${r.message}` : `[error] ${r.message}`, r.ok ? '' : 'outcome');
}
async function doRun() {
  clearLog();
  const r = await api('/api/run', 'POST');
  if (!r.ok) { logLine(`[error] ${r.message}`, 'outcome'); return; }
  eventsSince = 0;
  setStatus('Running…', true);
  startPolling();
}
async function doExport() {
  const r = await api('/api/export', 'POST');
  logLine(r.ok ? r.message : `[error] ${r.message}`, r.ok ? '' : 'outcome');
}

async function openOptions() {
  const s = await loadStatus();
  $('opt-tone').value = s.tone || '';
  $('opt-model').value = s.model_model || '';
  $('opt-base-url').value = s.model_base_url || '';
  $('opt-api-key-env').value = s.model_api_key_env || '';
  const list = $('opt-archs');
  list.innerHTML = '';
  (s.archetypes || []).forEach(a => {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!a.enabled;
    cb.dataset.id = a.id;
    label.appendChild(cb);
    const span = document.createElement('span');
    span.innerHTML = `<strong>${esc(a.name)}</strong>${a.custom ? ' <em style="color:#8a90a8">(custom)</em>' : ''}<br/><span class="pers">${esc(a.persona)}</span>`;
    label.appendChild(span);
    list.appendChild(label);
  });
  $('opts-overlay').classList.remove('hidden');
}
function closeOptions() { $('opts-overlay').classList.add('hidden'); }
async function saveOptions() {
  const enabled = Array.from(document.querySelectorAll('#opt-archs input:checked')).map(cb => cb.dataset.id);
  const r = await api('/api/options', 'POST', {
    tone: $('opt-tone').value,
    model: $('opt-model').value,
    base_url: $('opt-base-url').value,
    api_key_env: $('opt-api-key-env').value,
    enabled_archetypes: enabled,
  });
  closeOptions();
  logLine(r.message, r.ok ? '' : 'outcome');
  await loadStatus();
}

$('btn-open').onclick = doOpen;
$('btn-new').onclick = doNew;
$('btn-generate').onclick = doGenerate;
$('btn-validate').onclick = doValidate;
$('btn-run').onclick = doRun;
$('btn-export').onclick = doExport;
$('btn-options').onclick = openOptions;
$('btn-clear').onclick = clearLog;
$('opt-cancel').onclick = closeOptions;
$('opt-save').onclick = saveOptions;
$('opts-overlay').addEventListener('click', (e) => { if (e.target === $('opts-overlay')) closeOptions(); });

loadStatus();
</script>
</body>
</html>
